# Install once with: pre-commit install
# Run over everything with: pre-commit run --all-files
#
# Lint and format only. The tests are `uv run pytest`, kept out of the hook
# because they start Chrome and take about half a minute.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      # um_vpn.py is installed by copying it onto PATH, so it has to stay
      # executable.
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Markdown only: the docs are hand-wrapped at 80, like the code.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types: [markdown]

  - repo: local
    hooks:
      # The DSID is a live authenticated session. um-vpn never writes it to
      # disk; this is the backstop against a copy pasted into a file.
      - id: no-dsid
        name: no DSID session cookie in the tree
        entry: DSID=[0-9a-fA-F]{16,}
        language: pygrep
        types: [text]
