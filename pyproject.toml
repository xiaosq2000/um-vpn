[project]
name = "um-vpn"
version = "2.0.0"
description = "University of Macau SSL VPN on Linux: browser login, NetworkManager tunnel"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
um-vpn = "um_vpn:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["um_vpn"]

# pixi manages development. `pixi global install --git` also builds um-vpn
# from this file, into an environment that brings its own secret-tool.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "0.*" }

[tool.pixi.package.host-dependencies]
setuptools = ">=77"

[tool.pixi.package.run-dependencies]
libsecret = "*"  # secret-tool, for the stored UMPASS sign-in

[tool.pixi.dependencies]
pre-commit = "*"
pytest = ">=8"

[tool.pixi.tasks]
test = "pytest"
lint = "pre-commit run --all-files"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import um_vpn from the checkout, so nothing needs installing.
pythonpath = ["."]

# PEP 8: 4-space indent, 79 columns.
[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
# E,F are ruff's defaults; I keeps import order stable, B catches the easy
# runtime traps, UP keeps the syntax modern.
select = ["E", "F", "I", "B", "UP"]
